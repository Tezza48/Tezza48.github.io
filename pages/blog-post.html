<StaticTemplate src="templates/base.html">
    <article class="mt-5">
        <div id="post-content"></div>
    </article>
    <script type="module">
        const postContentDiv = document.getElementById("post-content");
        const params = new URLSearchParams(document.location.search);

        const postContentName = params.get("blogPost");
        const postContent = await(
            await fetch(`${postContentName}.html`)
        ).text();
        postContentDiv.outerHTML = postContent;
    </script>
</StaticTemplate>
